<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
<match target="scan">
    <test name="family">
        <string>CMU Typewriter Text</string>
    </test>
    <edit name="spacing">
        <int>100</int>
    </edit>
</match>
<match target="scan">
    <test name="family">
        <string>CMU Typewriter Slashed</string>
    </test>
    <edit name="spacing">
        <int>100</int>
    </edit>
</match>
<!-- Iosevka Fixed Slab has no Nerd Font icons; fall back to the
     icons-only Symbols Nerd Font for any glyph it lacks. -->
<alias>
    <family>Iosevka Fixed Slab</family>
    <prefer>
        <family>Iosevka Fixed Slab</family>
        <family>Symbols Nerd Font</family>
    </prefer>
</alias>
</fontconfig>
